<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pokémon 카드 재고 레이더</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#14161a;--muted:#6b7280;--line:#e7e9ee;--good:#0f9f6e;--warn:#b76b00;--accent:#365cf5;--info:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1140px;margin:auto;padding:24px 16px 56px}.hero{background:linear-gradient(135deg,#111827,#263f84);color:#fff;border-radius:24px;padding:26px;box-shadow:0 14px 40px rgba(17,24,39,.16)}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.7}.hero h1{margin:7px 0;font-size:32px}.hero p{margin:0;opacity:.82;line-height:1.55}
.toolbar{display:grid;grid-template-columns:1.15fr .7fr .9fr;gap:12px;margin:16px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 20px rgba(17,24,39,.04)}label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}input,select,button{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:14px}button{cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff;border:none}.quick{display:flex;gap:8px;margin-top:8px}.quick button{padding:9px;font-size:12px}
#map{height:480px;border-radius:20px;border:1px solid var(--line);overflow:hidden}.mapbox{position:relative}.map-status{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(255,255,255,.96);padding:9px 11px;border-radius:12px;border:1px solid var(--line);font-size:12px}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:24px 0 12px}.section-title h2{margin:0;font-size:20px}.section-title span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.store{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.store h3{margin:0 0 4px;font-size:18px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}.item:first-of-type{margin-top:12px}.item-name{font-weight:700;font-size:14px;line-height:1.4}.item-sub{font-size:11px;color:var(--muted);margin-top:3px}.qty{font-size:21px;font-weight:800;white-space:nowrap}.badge{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700;margin-left:6px}.good{background:#e8f8f0;color:#087a54}.info{background:#eaf2ff;color:#1d4ed8}.empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd0db;border-radius:18px;padding:30px;text-align:center;color:var(--muted)}.note{margin-top:22px;font-size:12px;line-height:1.65;color:var(--muted)}
@media(max-width:760px){.toolbar,.grid{grid-template-columns:1fr}.hero h1{font-size:27px}#map{height:420px}.quick{flex-wrap:wrap}.quick button{flex:1 1 30%}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><div class="eyebrow">LIVE TEST v0.7</div><h1>Pokémon 카드 재고 레이더</h1><p>‘포켓몬카드’, ‘포켓몬확장팩’을 검색해 실제 TCG 상품만 남기고, 재고가 있는 상품을 매장별로 보여줍니다.</p></section>
<section class="toolbar">
<div class="panel"><label>지역 검색</label><input id="place" placeholder="예: 강남역, 잠실, 하남 감일동"/><div class="quick"><button data-lat="37.4765" data-lng="126.9638">낙성대</button><button data-lat="37.5086" data-lng="127.1607">감일동</button><button id="me">내 위치</button></div></div>
<div class="panel"><label>편의점</label><select id="brand"><option value="all">전체</option><option value="GS25">GS25</option><option value="emart24">이마트24</option><option value="CU">CU</option><option value="7ELEVEN">세븐일레븐</option></select></div>
<div class="panel"><label>포켓몬카드 조회</label><button class="primary" id="refresh">이 지역 포켓몬카드 재고 조회</button></div>
</section>
<div class="mapbox"><div id="map"></div><div class="map-status" id="mapStatus">지도를 움직인 뒤 조회하세요</div></div>
<div class="section-title"><h2>매장별 포켓몬카드 재고</h2><span id="status">아직 조회 안 함</span></div>
<section id="stores" class="grid"><div class="empty">원하는 지역으로 지도를 옮긴 뒤 조회 버튼을 눌러주세요.</div></section>
<p class="note"><strong>검색 기준:</strong> 실제 포켓몬 TCG의 확장팩·강화확장팩·부스터·스타터덱·덱·팩·박스·세트 계열만 표시합니다. 교통카드·카드케이스·슬리브·바인더·스티커·과자·음료 등은 제외하고, <strong>재고 0개 상품은 표시하지 않습니다.</strong></p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const API='https://mcp.aka.page';
const SEARCH_TERMS=['포켓몬카드','포켓몬확장팩'];
const map=L.map('map').setView([37.5008,127.0257],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const markers=L.layerGroup().addTo(map);
let grouped=[];
function qs(obj){return new URLSearchParams(Object.entries(obj).filter(([,v])=>v!==undefined&&v!==null&&v!==''))}
async function getJSON(path,params){const r=await fetch(API+path+'?'+qs(params),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function reversePlace(lat,lng){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16&accept-language=ko`);const j=await r.json();const a=j.address||{};return a.suburb||a.quarter||a.neighbourhood||a.city_district||a.town||a.city||''}catch{return ''}}
function productOf(brand,p){return{brand,name:p.name||p.goodsName||p.itemName||'상품',code:p.itemCode||p.pluCd||'',price:p.sellPrice??p.viewPrice??p.originPrice??p.price??null}}
function isPokemonCardProduct(name){
  const s=(name||'').replace(/\s+/g,'').toLowerCase();
  const excluded=/(교통카드|카드케이스|케이스|슬리브|프로텍터|바인더|앨범|카드파일|파일|카드홀더|홀더|카드지갑|지갑|스티커|키링|피규어|인형|문구|볼펜|초코|쿠키|음료|캔디|젤리|빵|우유|아이스크림|껌|스낵|과자|라면|주스|탄산|커피|사탕|초콜릿|파이)/i;
  if(excluded.test(s))return false;
  const tcg=/(확장팩|강화확장팩|부스터|스타터덱|스타트덱|구축덱|덱세트|스페셜세트|컬렉션세트|트레이너박스|박스|box|booster|deck|pack|tcg|30th)/i;
  const pokemonCard=/^(포켓몬|pokemon)/i.test(s)&&/(카드|card)/i.test(s);
  return tcg.test(s)||pokemonCard;
}
async function searchProducts(brand,term){if(brand==='GS25'){const j=await getJSON('/api/gs25/products',{keyword:term,limit:40});return (j.data?.products||[]).map(p=>productOf(brand,p))}if(brand==='emart24'){const j=await getJSON('/api/emart24/products',{keyword:term,page:1,pageSize:40});return (j.data?.products||[]).map(p=>productOf(brand,p))}if(brand==='CU'){const j=await getJSON('/api/cu/inventory',{keyword:term,storeCheck:false,size:40});return (j.data?.inventory?.items||[]).map(p=>productOf(brand,p))}if(brand==='7ELEVEN'){const j=await getJSON('/api/seveneleven/products',{query:term,page:1,size:40});return (j.data?.products||j.data?.items||[]).map(p=>productOf(brand,p))}return[]}
async function inventory(brand,p,lat,lng,place){if(brand==='GS25')return getJSON('/api/gs25/inventory',{keyword:p.name,itemCode:p.code||undefined,lat,lng,storeKeyword:place,storeLimit:50});if(brand==='emart24')return getJSON('/api/emart24/inventory',{keyword:p.name,pluCd:p.code||undefined,lat,lng,storeKeyword:place,storeLimit:50});if(brand==='CU')return getJSON('/api/cu/inventory',{keyword:p.name,lat,lng,storeKeyword:place,size:30,storeLimit:50});if(brand==='7ELEVEN')return getJSON('/api/seveneleven/inventory',{keyword:p.name,storeKeyword:place,storeLimit:50,timeoutMs:20000})}
function storesFrom(brand,j){if(brand==='GS25')return (j.data?.inventory?.stores||[]).map(s=>({code:s.storeCode,name:s.storeName,address:s.address,phone:s.phone,lat:Number(s.latitude),lng:Number(s.longitude),stock:Number.isFinite(Number(s.realStockQuantity))?Number(s.realStockQuantity):null}));if(brand==='emart24'){const byCode=new Map((j.data?.nearbyStores?.stores||[]).map(s=>[s.storeCode,s]));return (j.data?.stores||[]).map(s=>{const x={...byCode.get(s.bizNo),...s};return{code:s.bizNo,name:x.storeName,address:x.address,phone:x.phone,lat:Number(x.latitude),lng:Number(x.longitude),stock:Number.isFinite(Number(s.bizQty))?Number(s.bizQty):null}})}if(brand==='CU')return (j.data?.nearbyStores?.stores||[]).map(s=>({code:s.storeCode,name:s.storeName,address:s.address,phone:s.phone,lat:Number(s.latitude),lng:Number(s.longitude),stock:Number.isFinite(Number(s.stock))?Number(s.stock):null}));if(brand==='7ELEVEN')return (j.data?.inventory?.stores||[]).map(s=>({code:s.storeCode,name:s.storeName,address:s.address,phone:'',lat:Number(s.latitude),lng:Number(s.longitude),stock:Number.isFinite(Number(s.stockQuantity))?Number(s.stockQuantity):null}));return[]}
function groupStoreRows(rows){const m=new Map();for(const r of rows){const key=r.brand+'|'+(r.store.code||r.store.name);if(!m.has(key))m.set(key,{brand:r.brand,...r.store,items:[]});const g=m.get(key);const ik=r.product.name+'|'+r.product.code;if(!g.items.some(x=>(x.name+'|'+x.code)===ik))g.items.push({...r.product,stock:r.store.stock})}return [...m.values()]}
function render(){
  const root=document.getElementById('stores'),b=map.getBounds(),sel=document.getElementById('brand').value;
  const list=grouped
    .filter(s=>(sel==='all'||s.brand===sel)&&Number.isFinite(s.lat)&&Number.isFinite(s.lng)&&b.contains([s.lat,s.lng]))
    .map(s=>({...s,items:s.items.filter(x=>x.stock===null||x.stock>0).sort((a,b)=>(b.stock??-1)-(a.stock??-1))}))
    .filter(s=>s.items.length>0)
    .sort((a,b)=>Math.max(...b.items.map(x=>x.stock??-1))-Math.max(...a.items.map(x=>x.stock??-1)));
  markers.clearLayers();
  if(!list.length){root.innerHTML='<div class="empty">현재 지도 화면에서 재고가 있는 포켓몬카드 상품을 찾지 못했습니다.</div>';return}
  list.forEach(s=>{const inStock=s.items.filter(x=>(x.stock??0)>0).length;L.marker([s.lat,s.lng]).addTo(markers).bindPopup(`<b>${s.brand} ${s.name}</b><br>포켓몬카드 ${inStock}종 재고 있음<br>${s.address||''}`)});
  root.innerHTML=list.map(s=>`<article class="store"><h3>${s.brand} ${s.name}</h3><div class="meta">${s.address||'주소 정보 없음'}${s.phone?'<br>전화 '+s.phone:''}</div>${s.items.map(x=>`<div class="item"><div><div class="item-name">${x.name}</div><div class="item-sub">${x.code?'코드 '+x.code:''}${x.price!=null?' · '+Number(x.price).toLocaleString()+'원':''}</div></div><div><span class="qty">${x.stock===null?'?':x.stock+'개'}</span><span class="badge ${x.stock===null?'info':'good'}">${x.stock===null?'확인 필요':'재고'}</span></div></div>`).join('')}</article>`).join('')
}
async function refresh(){const btn=document.getElementById('refresh'),sel=document.getElementById('brand').value,brands=sel==='all'?['GS25','emart24','CU','7ELEVEN']:[sel],c=map.getCenter(),place=await reversePlace(c.lat,c.lng);btn.disabled=true;btn.textContent='상품/재고 조회 중...';document.getElementById('status').textContent='상품 검색 중';document.getElementById('stores').innerHTML='<div class="empty">포켓몬카드 상품을 찾고 매장별 재고를 조회 중입니다. 잠시만 기다려주세요.</div>';
let products=[],fail=0;const sr=await Promise.allSettled(brands.flatMap(b=>SEARCH_TERMS.map(t=>searchProducts(b,t))));for(const r of sr){if(r.status==='fulfilled')products.push(...r.value);else fail++}const seen=new Set();products=products.filter(p=>{const k=p.brand+'|'+p.name+'|'+p.code;if(seen.has(k))return false;seen.add(k);return isPokemonCardProduct(p.name)});
document.getElementById('status').textContent=`TCG 상품 ${products.length}종 · 재고 조회 중`;
const rows=[];let done=0;const tasks=products.slice(0,40).map(async p=>{try{const j=await inventory(p.brand,p,c.lat,c.lng,place);const ss=storesFrom(p.brand,j);for(const s of ss)rows.push({brand:p.brand,product:p,store:s})}catch{fail++}finally{done++;document.getElementById('status').textContent=`TCG 상품 ${products.length}종 · ${done}/${Math.min(products.length,40)} 재고 조회`}});await Promise.allSettled(tasks);grouped=groupStoreRows(rows);const visibleStores=grouped.filter(s=>s.items.some(x=>x.stock===null||x.stock>0)).length;document.getElementById('status').textContent=`${visibleStores}개 매장 · TCG 상품 ${products.length}종${fail?' · 일부 조회 실패':''}`;render();btn.disabled=false;btn.textContent='이 지역 포켓몬카드 재고 조회'}
function moveTo(lat,lng,z=15){map.setView([lat,lng],z)}document.querySelectorAll('.quick button[data-lat]').forEach(b=>b.onclick=()=>moveTo(+b.dataset.lat,+b.dataset.lng));document.getElementById('me').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>moveTo(p.coords.latitude,p.coords.longitude),()=>alert('위치 권한을 허용해주세요.')):alert('위치 기능을 사용할 수 없습니다.');document.getElementById('refresh').onclick=refresh;document.getElementById('brand').onchange=render;map.on('moveend',()=>{const c=map.getCenter();document.getElementById('mapStatus').textContent=`지도 중심 ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)} · 조회 버튼을 누르세요`});document.getElementById('place').addEventListener('keydown',async e=>{if(e.key!=='Enter')return;const q=e.target.value.trim();if(!q)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(q));const d=await r.json();if(d.length)moveTo(+d[0].lat,+d[0].lon,15);else alert('장소를 찾지 못했습니다.')}catch{alert('장소 검색 실패')}});
</script>
</body>
</html>

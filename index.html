<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pokémon 카드 재고 레이더</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#14161a;--muted:#6b7280;--line:#e7e9ee;--good:#0f9f6e;--warn:#b76b00;--accent:#365cf5;--info:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1120px;margin:auto;padding:24px 16px 56px}.hero{background:linear-gradient(135deg,#111827,#263f84);color:#fff;border-radius:24px;padding:26px;box-shadow:0 14px 40px rgba(17,24,39,.16)}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.7}.hero h1{margin:7px 0;font-size:32px}.hero p{margin:0;opacity:.82;line-height:1.55}
.toolbar{display:grid;grid-template-columns:1.1fr .7fr 1fr;gap:12px;margin:16px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 20px rgba(17,24,39,.04)}label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}input,select,button{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:14px}button{cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff;border:none}.quick{display:flex;gap:8px;margin-top:8px}.quick button{padding:9px;font-size:12px}
#map{height:470px;border-radius:20px;border:1px solid var(--line);overflow:hidden}.mapbox{position:relative}.map-status{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(255,255,255,.96);padding:9px 11px;border-radius:12px;border:1px solid var(--line);font-size:12px}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:24px 0 12px}.section-title h2{margin:0;font-size:20px}.section-title span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.store,.product{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.row{display:flex;justify-content:space-between;gap:12px}.store h3,.product h3{margin:0 0 5px;font-size:17px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.stock{font-size:27px;font-weight:800;white-space:nowrap}.badge{display:inline-flex;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700;margin-top:10px}.good{background:#e8f8f0;color:#087a54}.warn{background:#fff3d9;color:#945b00}.info{background:#eaf2ff;color:#1d4ed8}.small{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:#59606b;line-height:1.6}.empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd0db;border-radius:18px;padding:30px;text-align:center;color:var(--muted)}.note{margin-top:22px;font-size:12px;line-height:1.65;color:var(--muted)}
.product button{margin-top:12px}.selected{outline:2px solid var(--accent)}
@media(max-width:760px){.toolbar,.grid{grid-template-columns:1fr}.hero h1{font-size:27px}#map{height:420px}.quick{flex-wrap:wrap}.quick button{flex:1 1 30%}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><div class="eyebrow">LIVE TEST v0.5</div><h1>Pokémon 카드 재고 레이더</h1><p>포켓몬 카드 상품을 먼저 찾고, 원하는 상품을 선택한 뒤 지도 주변 편의점 재고를 조회합니다.</p></section>
<section class="toolbar">
<div class="panel"><label>지역 검색</label><input id="place" placeholder="예: 강남역, 잠실, 하남 감일동"/><div class="quick"><button data-lat="37.4765" data-lng="126.9638">낙성대</button><button data-lat="37.5086" data-lng="127.1607">감일동</button><button id="me">내 위치</button></div></div>
<div class="panel"><label>편의점</label><select id="brand"><option value="all">전체</option><option value="GS25">GS25</option><option value="emart24">이마트24</option><option value="CU">CU</option><option value="7ELEVEN">세븐일레븐</option></select></div>
<div class="panel"><label>상품 검색</label><input id="product" value="포켓몬"/><button class="primary" id="findProducts" style="margin-top:8px">포켓몬 카드 상품 찾기</button></div>
</section>
<div class="section-title"><h2>검색된 상품</h2><span id="productStatus">아직 검색 안 함</span></div>
<section id="products" class="grid"><div class="empty">‘포켓몬 카드 상품 찾기’를 눌러 상품 목록을 불러오세요.</div></section>
<div class="mapbox"><div id="map"></div><div class="map-status" id="mapStatus">지도를 움직인 뒤 상품을 선택하세요</div></div>
<div class="section-title"><h2>선택 상품 재고</h2><span id="updated">상품을 선택하세요</span></div>
<section id="stores" class="grid"><div class="empty">위에서 상품을 선택하면 이 지도 주변 재고를 조회합니다.</div></section>
<p class="note"><strong>주의:</strong> 편의점 전산 재고는 실제 진열·판매 시점과 차이가 날 수 있습니다. 수량 미확인/조회 실패는 품절로 처리하지 않습니다.</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const API='https://mcp.aka.page';
const map=L.map('map').setView([37.5008,127.0257],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const markers=L.layerGroup().addTo(map);
let latest=[], catalog=[], selectedProduct=null;
function qs(obj){return new URLSearchParams(Object.entries(obj).filter(([,v])=>v!==undefined&&v!==null&&v!==''))}
async function getJSON(path,params){const r=await fetch(API+path+'?'+qs(params),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function reversePlace(lat,lng){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16&accept-language=ko`);const j=await r.json();const a=j.address||{};return a.suburb||a.quarter||a.neighbourhood||a.city_district||a.town||a.city||''}catch{return ''}}
function normProduct(brand,p){return{brand,name:p.name||p.goodsName||p.itemName||'상품',code:p.itemCode||p.pluCd||'',price:p.sellPrice??p.viewPrice??p.originPrice??p.price??null}}
async function searchBrandProducts(brand,q){if(brand==='GS25'){const j=await getJSON('/api/gs25/products',{keyword:q,limit:30});return (j.data?.products||[]).map(p=>normProduct(brand,p))}if(brand==='emart24'){const j=await getJSON('/api/emart24/products',{keyword:q,page:1,pageSize:30});return (j.data?.products||[]).map(p=>normProduct(brand,p))}if(brand==='CU'){const j=await getJSON('/api/cu/inventory',{keyword:q,storeCheck:false,size:30});return (j.data?.inventory?.items||[]).map(p=>normProduct(brand,p))}if(brand==='7ELEVEN'){const j=await getJSON('/api/seveneleven/products',{query:q,page:1,size:30});return (j.data?.products||j.data?.items||[]).map(p=>normProduct(brand,p))}return[]}
function renderProducts(){const root=document.getElementById('products');if(!catalog.length){root.innerHTML='<div class="empty">검색된 포켓몬 카드 상품이 없습니다.</div>';return}root.innerHTML=catalog.map((p,i)=>`<article class="product ${selectedProduct&&selectedProduct.brand===p.brand&&selectedProduct.name===p.name?'selected':''}"><div class="row"><div><h3>${p.name}</h3><div class="meta">${p.brand}${p.code?' · 코드 '+p.code:''}</div></div><div>${p.price!=null?Number(p.price).toLocaleString()+'원':''}</div></div><button onclick="selectProduct(${i})">이 상품 재고 보기</button></article>`).join('')}
async function findProducts(){const q=document.getElementById('product').value.trim()||'포켓몬',sel=document.getElementById('brand').value,brands=sel==='all'?['GS25','emart24','CU','7ELEVEN']:[sel],btn=document.getElementById('findProducts');btn.disabled=true;btn.textContent='상품 검색 중...';document.getElementById('productStatus').textContent='검색 중';const rs=await Promise.allSettled(brands.map(async b=>({brand:b,items:await searchBrandProducts(b,q)})));catalog=[];let failed=0;for(const r of rs){if(r.status==='fulfilled')catalog.push(...r.value.items);else failed++}const seen=new Set();catalog=catalog.filter(p=>{const k=p.brand+'|'+p.name; if(seen.has(k))return false;seen.add(k);return /포켓몬|pokemon|30th|카드|확장팩/i.test(p.name)});document.getElementById('productStatus').textContent=`${catalog.length}개 상품${failed?' · '+failed+'개 서비스 실패':''}`;renderProducts();btn.disabled=false;btn.textContent='포켓몬 카드 상품 찾기'}
function normStore(brand,s){const stock=brand==='GS25'?s.realStockQuantity:brand==='emart24'?s.bizQty:brand==='7ELEVEN'?s.stockQuantity:s.stock;return{brand,name:s.storeName||s.name||s.bizName||'매장',address:s.address||s.storeAddr||'',phone:s.phone||s.tel||'',lat:Number(s.latitude??s.lat),lng:Number(s.longitude??s.lng),stock:Number.isFinite(Number(stock))?Number(stock):null}}
function pullStores(brand,j){if(brand==='GS25')return (j.data?.inventory?.stores||[]).map(s=>normStore(brand,s));if(brand==='emart24'){const byCode=new Map((j.data?.nearbyStores?.stores||[]).map(s=>[s.storeCode,s]));return (j.data?.stores||[]).map(s=>normStore(brand,{...byCode.get(s.bizNo),...s}))}if(brand==='CU')return (j.data?.nearbyStores?.stores||[]).map(s=>normStore(brand,s));if(brand==='7ELEVEN')return (j.data?.inventory?.stores||[]).map(s=>normStore(brand,s));return[]}
async function queryInventory(p,lat,lng,place){if(p.brand==='GS25')return getJSON('/api/gs25/inventory',{keyword:p.name,itemCode:p.code||undefined,lat,lng,storeKeyword:place,storeLimit:50});if(p.brand==='emart24')return getJSON('/api/emart24/inventory',{keyword:p.name,pluCd:p.code||undefined,lat,lng,storeKeyword:place,storeLimit:50});if(p.brand==='CU')return getJSON('/api/cu/inventory',{keyword:p.name,lat,lng,storeKeyword:place,size:30,storeLimit:50});if(p.brand==='7ELEVEN')return getJSON('/api/seveneleven/inventory',{keyword:p.name,storeKeyword:place,storeLimit:50,timeoutMs:20000})}
function renderStores(){const root=document.getElementById('stores'),b=map.getBounds();const list=latest.filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lng)&&b.contains([x.lat,x.lng])).sort((a,b)=>(b.stock??-1)-(a.stock??-1));markers.clearLayers();if(!list.length){root.innerHTML='<div class="empty">현재 지도 화면에서 확인된 재고가 없습니다.</div>';return}list.forEach(x=>L.marker([x.lat,x.lng]).addTo(markers).bindPopup(`<b>${x.brand} ${x.name}</b><br>${x.stock===null?'수량 확인 필요':x.stock+'개'}<br>${x.address}`));root.innerHTML=list.map(x=>`<article class="store"><div class="row"><div><h3>${x.brand} ${x.name}</h3><div class="meta">${x.address||'주소 정보 없음'}</div></div><div class="stock">${x.stock===null?'확인 필요':x.stock+'개'}</div></div><span class="badge ${x.stock===null?'info':x.stock===0?'warn':'good'}">${x.stock===null?'수량 미확인':x.stock===0?'0개 확인':'재고 있음'}</span><div class="small">${x.phone?'전화 '+x.phone+' · ':''}조회시각 ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div></article>`).join('')}
async function selectProduct(i){selectedProduct=catalog[i];renderProducts();const c=map.getCenter(),place=await reversePlace(c.lat,c.lng);document.getElementById('updated').textContent=`${selectedProduct.name} 조회 중...`;document.getElementById('stores').innerHTML='<div class="empty">선택 상품 실재고 조회 중...</div>';try{const j=await queryInventory(selectedProduct,c.lat,c.lng,place);latest=pullStores(selectedProduct.brand,j);document.getElementById('updated').textContent=`${selectedProduct.brand} · ${selectedProduct.name} · ${latest.length}개 매장`;renderStores()}catch(e){latest=[];document.getElementById('updated').textContent='조회 실패';document.getElementById('stores').innerHTML=`<div class="empty">${selectedProduct.brand} 재고 조회에 실패했습니다.<br><small>${e.message}</small></div>`}}
window.selectProduct=selectProduct;
function moveTo(lat,lng,z=15){map.setView([lat,lng],z)}document.querySelectorAll('.quick button[data-lat]').forEach(b=>b.onclick=()=>moveTo(+b.dataset.lat,+b.dataset.lng));document.getElementById('me').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>moveTo(p.coords.latitude,p.coords.longitude),()=>alert('위치 권한을 허용해주세요.')):alert('위치 기능을 사용할 수 없습니다.');document.getElementById('findProducts').onclick=findProducts;document.getElementById('brand').onchange=()=>{catalog=[];selectedProduct=null;renderProducts()};map.on('moveend',()=>{const c=map.getCenter();document.getElementById('mapStatus').textContent=`지도 중심 ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)} · 상품을 선택하면 이 주변 재고를 조회합니다`});document.getElementById('place').addEventListener('keydown',async e=>{if(e.key!=='Enter')return;const q=e.target.value.trim();if(!q)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(q));const d=await r.json();if(d.length)moveTo(+d[0].lat,+d[0].lon,15);else alert('장소를 찾지 못했습니다.')}catch{alert('장소 검색 실패')}});
</script>
</body></html>
